services:
  # ==========================================
  # SERVICIO: BASE DE DATOS POSTGRESQL (Puerto Host: 4002)
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: biomecanic_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-BiomecanicSport}
      POSTGRES_USER: ${POSTGRES_USER:-biomecanic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biomecanic_secret_password}
    ports:
      - "${POSTGRES_PORT_HOST:-4002}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biomecanic_user} -d ${POSTGRES_DB:-BiomecanicSport}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - biomecanic_network

  # ==========================================
  # SERVICIO: REDIS (Puerto Host: 4003)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: biomecanic_redis
    restart: always
    ports:
      - "${REDIS_PORT_HOST:-4003}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - biomecanic_network

  # ==========================================
  # SERVICIO: BACKEND PRINCIPAL DJANGO (Puerto Host: 4000)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: biomecanic_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-4000}:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - biomecanic_network

  # ==========================================
  # SERVICIO: MACHINE LEARNING FASTAPI (Puerto Host: 4001)
  # ==========================================
  ml_service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: biomecanic_ml_service
    restart: unless-stopped
    command: uvicorn infrastructure.main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./ml_service:/app
    ports:
      - "${ML_SERVICE_PORT:-4001}:8001"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - biomecanic_network

# ==========================================
# VOLÚMENES PERSISTENTES
# ==========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ==========================================
# REDES INTERNAS
# ==========================================
networks:
  biomecanic_network:
    driver: bridge
